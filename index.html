<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b4d">
<title>公民テスト対策クイズ</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f7f5,#101815);--panel:light-dark(#ffffff,#1a2420);--text:light-dark(#17231d,#edf5f0);--muted:light-dark(#63736a,#a8b8af);--line:light-dark(#dce7e0,#34463c);--green:light-dark(#176b4d,#73d6a7);--greenText:light-dark(#fff,#10261b);--wrong:light-dark(#b42318,#ff8f86);--soft:light-dark(#e7f4ec,#243b2e)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6}.app{min-height:100vh;background:var(--bg);padding:22px 14px 44px}.wrap{max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,#14583f,#21845e);color:white;border-radius:22px;padding:23px 21px;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.8;font-weight:700}.hero h1{font-size:clamp(24px,6vw,34px);line-height:1.25;margin:8px 0}.hero p{margin:0;color:#e0f3e8;font-size:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #00000008}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:750;transition:transform .08s,opacity .2s}button:active{transform:scale(.98)}.primary{background:var(--green);color:var(--greenText)}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.full{width:100%;margin-top:14px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700}.progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 20px}.bar{height:100%;width:0;background:var(--green);transition:width .2s}.category{display:inline-flex;background:var(--soft);color:var(--green);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:12px}.question{font-size:21px;font-weight:800;line-height:1.5;margin:0 0 18px}.answers{display:grid;gap:10px}.answer{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:13px;border-radius:13px;font-weight:600}.letter{flex:0 0 27px;width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--soft);color:var(--green);font-size:13px}.answer.correct{border-color:#1b9b65;background:light-dark(#e9f8ef,#1c3b2b)}.answer.incorrect{border-color:var(--wrong);background:light-dark(#fff0ee,#3b2422)}.answer:disabled{cursor:default;opacity:1}.feedback{display:none;border-radius:13px;padding:13px 14px;margin-top:14px;font-size:14px}.feedback.show{display:block}.feedback.good{background:light-dark(#e9f8ef,#1c3b2b)}.feedback.bad{background:light-dark(#fff0ee,#3b2422)}.feedback strong{display:block;margin-bottom:4px}.controls{display:flex;gap:10px;margin-top:16px}.controls button{flex:1}.result{text-align:center;padding:26px 18px}.score{font-size:48px;font-weight:900;color:var(--green);line-height:1.2;margin:8px}.result h2{margin:5px 0}.result p{color:var(--muted)}.review{display:grid;gap:10px;text-align:left;margin-top:20px}.review-item{border:1px solid var(--line);border-radius:12px;padding:12px}.review-item .miss{color:var(--wrong);font-size:12px;font-weight:800}.review-item .hit{color:var(--green);font-size:12px;font-weight:800}.hidden{display:none!important}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}@media(max-width:480px){.settings{grid-template-columns:1fr}.panel{padding:15px}.question{font-size:19px}.hero{padding:20px 18px}.controls{flex-direction:column}}
</style>
</head>
<body><main class="app"><div class="wrap">
<header class="hero"><div class="eyebrow">JUNIOR HIGH · CIVICS</div><h1>公民テスト対策クイズ</h1><p>現代社会・日本国憲法・基本的人権・平和主義<br>選んで答えるだけ！その場で正誤と解説がわかるよ。</p></header>
<section id="setup" class="panel"><h2 style="margin:0 0 14px">クイズを設定</h2><div class="settings"><div class="field"><label for="category">出題範囲</label><select id="category"><option value="all">すべての範囲</option><option>現代社会</option><option>憲法</option><option>人権</option><option>国際社会</option><option>平和主義</option></select></div><div class="field"><label for="count">問題数</label><select id="count"><option value="10">10問</option><option value="20" selected>20問</option><option value="all">全問</option></select></div></div><button id="start" class="primary full">クイズ開始 →</button><p class="note">全問からランダムに出題。何度でも挑戦できるよ。</p></section>
<section id="quiz" class="panel hidden"><div class="topline"><span id="counter">第1問 / 20問</span><span id="scoreLive">正解 0</span></div><div class="progress"><div id="bar" class="bar"></div></div><span id="catLabel" class="category">憲法</span><h2 id="question" class="question"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="controls"><button id="quit" class="secondary">終了する</button><button id="next" class="primary" disabled>次の問題 →</button></div></section>
<section id="result" class="panel result hidden"><div class="eyebrow" style="color:var(--muted)">QUIZ COMPLETE</div><h2 id="resultTitle">おつかれさま！</h2><div id="scoreFinal" class="score">0 / 20</div><p id="resultMessage"></p><button id="retry" class="primary full">もう一度挑戦する ↻</button><div id="review" class="review"></div></section>
<p class="note">学習用オリジナル問題 · 答えを覚えるだけでなく、解説も読んで理解しよう！</p>
</div></main>
<script>
const QUESTIONS = [{"c":"現代社会","q":"1950年代後半から1970年代初めごろ、日本経済が急速に成長したことを何という？","a":"高度経済成長","e":"1950年代後半〜1970年代初めごろの急速な経済成長。","options":["産業の空洞化","高度経済成長","バブル経済","石油危機"],"answerIndex":1},{"c":"現代社会","q":"原料を輸入し、製品に加工して輸出する貿易は？","a":"加工貿易","e":"原料を輸入して工業製品に加工し、輸出する貿易。","options":["保護貿易","三角貿易","自由貿易","加工貿易"],"answerIndex":3},{"c":"現代社会","q":"1973年に日本経済に大きな影響を与えた、石油価格の急上昇は？","a":"石油危機（オイルショック）","e":"石油価格の急上昇が起こり、高度経済成長が終わる一因になった。","options":["世界恐慌","石油危機（オイルショック）","円高不況","バブル経済"],"answerIndex":1},{"c":"現代社会","q":"情報機器や通信環境の違いによって生じる格差は？","a":"情報格差（デジタル・デバイド）","e":"機器・通信環境・情報活用能力などの差による格差。","options":["所得格差","世代間格差","地域格差","情報格差（デジタル・デバイド）"],"answerIndex":3},{"c":"現代社会","q":"出生率の低下と高齢者の割合の増加が同時に進むことは？","a":"少子高齢化","e":"子どもが減り、高齢者の割合が増えること。","options":["核家族化","人口爆発","少子高齢化","都市化"],"answerIndex":2},{"c":"現代社会","q":"夫婦と未婚の子どもからなる家族を何という？","a":"核家族","e":"夫婦と未婚の子どもからなる家族。","options":["核家族","大家族","単身世帯","拡大家族"],"answerIndex":0},{"c":"現代社会","q":"対立する意見を調整し、関係者が納得できる結論に達することは？","a":"合意","e":"話し合いなどを通して納得できる結論に達すること。","options":["合意","効率","競争","対立"],"answerIndex":0},{"c":"憲法","q":"憲法によって政治権力を制限し、憲法に基づいて政治を行う考え方は？","a":"立憲主義","e":"憲法によって国家権力を制限し、権力の濫用を防ぐ考え方。","options":["直接民主制","立憲主義","専制政治","国民主権"],"answerIndex":1},{"c":"憲法","q":"大日本帝国憲法が発布された年は？","a":"1889年","e":"大日本帝国憲法は1889年に発布された。","options":["1868年","1946年","1889年","1947年"],"answerIndex":2},{"c":"憲法","q":"日本国憲法が公布された日は？","a":"1946年11月3日","e":"公布は1946年11月3日。文化の日。","options":["1946年11月3日","1951年9月8日","1945年8月15日","1947年5月3日"],"answerIndex":0},{"c":"憲法","q":"日本国憲法が施行された日は？","a":"1947年5月3日","e":"施行は1947年5月3日。憲法記念日。公布日と混同しない。","options":["1947年5月3日","1947年11月3日","1950年5月3日","1946年11月3日"],"answerIndex":0},{"c":"憲法","q":"日本国憲法の三大原則の正しい組み合わせは？","a":"国民主権・基本的人権の尊重・平和主義","e":"三大原則は国民主権、基本的人権の尊重、平和主義。","options":["国民主権・徴兵制・議院内閣制","基本的人権・地方自治・三権分立","天皇主権・富国強兵・平和主義","国民主権・基本的人権の尊重・平和主義"],"answerIndex":3},{"c":"憲法","q":"日本国憲法第1条で、天皇は何と定められている？","a":"日本国および日本国民統合の象徴","e":"天皇は日本国および日本国民統合の象徴。","options":["国会の代表者","国の主権者","行政の最高責任者","日本国および日本国民統合の象徴"],"answerIndex":3},{"c":"憲法","q":"憲法改正の発議に必要な各議院の賛成は、総議員の何分の何以上？","a":"3分の2以上","e":"各議院の総議員の3分の2以上で発議し、国民投票で過半数の賛成が必要。","options":["3分の1以上","3分の2以上","4分の1以上","過半数"],"answerIndex":1},{"c":"人権","q":"法の下の平等を定めている憲法の条文は？","a":"第14条","e":"第14条は法の下の平等を定める。","options":["第14条","第9条","第26条","第25条"],"answerIndex":0},{"c":"人権","q":"健康で文化的な最低限度の生活を営む権利は？","a":"生存権","e":"生存権は憲法第25条で保障される社会権。","options":["請願権","参政権","財産権","生存権"],"answerIndex":3},{"c":"人権","q":"教育を受ける権利を定めている憲法の条文は？","a":"第26条","e":"第26条は教育を受ける権利などを定める。","options":["第28条","第21条","第14条","第26条"],"answerIndex":3},{"c":"人権","q":"労働者が労働組合をつくる権利は？","a":"団結権","e":"団結権＝労働組合をつくる権利。","options":["団体交渉権","団結権","請願権","団体行動権"],"answerIndex":1},{"c":"人権","q":"使用者と労働条件などについて交渉する権利は？","a":"団体交渉権","e":"団体交渉権＝労働組合が使用者と交渉する権利。","options":["選挙権","団結権","団体交渉権","団体行動権"],"answerIndex":2},{"c":"人権","q":"ストライキなどを行う権利は？","a":"団体行動権","e":"団体行動権＝ストライキなどを行う権利。","options":["被選挙権","団体行動権","団結権","団体交渉権"],"answerIndex":1},{"c":"人権","q":"最高裁判所の裁判官をやめさせるべきか国民が審査する制度は？","a":"国民審査","e":"最高裁判所裁判官の国民審査。","options":["裁判員制度","住民監査請求","国民審査","国民投票"],"answerIndex":2},{"c":"人権","q":"私生活に関する情報をみだりに公開されない権利は？","a":"プライバシーの権利","e":"私生活や個人情報を不当に公開されない権利。","options":["プライバシーの権利","請願権","知る権利","環境権"],"answerIndex":0},{"c":"人権","q":"治療の説明を十分に受け、理解・納得したうえで同意することは？","a":"インフォームド・コンセント","e":"医師などから説明を受け、理解したうえで治療に同意すること。","options":["自己責任","情報リテラシー","国民審査","インフォームド・コンセント"],"answerIndex":3},{"c":"人権","q":"国や地方公共団体がもつ情報の公開を求める権利は？","a":"知る権利","e":"国などの情報公開を求める権利。","options":["財産権","知る権利","生存権","団結権"],"answerIndex":1},{"c":"人権","q":"人権どうしの衝突などを調整する考え方は？","a":"公共の福祉","e":"他人の権利や社会全体との調整を図る考え方。","options":["国民主権","公共の福祉","立憲主義","法の支配"],"answerIndex":1},{"c":"人権","q":"国民の三大義務に含まれないものはどれ？","a":"選挙に行く義務","e":"三大義務は教育を受けさせる義務・勤労の義務・納税の義務。","options":["教育を受けさせる義務","勤労の義務","納税の義務","選挙に行く義務"],"answerIndex":3},{"c":"国際社会","q":"1948年に国連総会で採択された人権に関する宣言は？","a":"世界人権宣言","e":"世界人権宣言は1948年に採択された。","options":["国際人権規約","子どもの権利条約","女子差別撤廃条約","世界人権宣言"],"answerIndex":3},{"c":"国際社会","q":"1989年に国連で採択された、子どもの人権を守る条約は？","a":"子どもの権利条約","e":"子どもの権利条約は1989年に採択された。","options":["日米安全保障条約","世界人権宣言","子どもの権利条約","女子差別撤廃条約"],"answerIndex":2},{"c":"国際社会","q":"政府から独立して国際的な課題に取り組む非政府組織の略称は？","a":"NGO","e":"NGOは非政府組織。PKOは国連平和維持活動。","options":["WHO","NPO","PKO","NGO"],"answerIndex":3},{"c":"平和主義","q":"憲法第9条の三つの要点に含まれないものは？","a":"国民主権","e":"第9条は戦争放棄・戦力不保持・交戦権否認。国民主権は三大原則の一つ。","options":["交戦権の否認","戦争の放棄","戦力の不保持","国民主権"],"answerIndex":3},{"c":"平和主義","q":"核兵器を「持たず、作らず、持ち込ませず」とする原則は？","a":"非核三原則","e":"非核三原則は「持たず、作らず、持ち込ませず」。","options":["集団的自衛権","非核三原則","平和五原則","専守防衛"],"answerIndex":1},{"c":"平和主義","q":"1950年、朝鮮戦争をきっかけに設置された組織は？","a":"警察予備隊","e":"1950年に警察予備隊が設置され、後の自衛隊につながった。","options":["警察予備隊","自衛隊","防衛省","国際連合"],"answerIndex":0},{"c":"平和主義","q":"自衛隊が発足した年は？","a":"1954年","e":"自衛隊は1954年に発足。","options":["1951年","1972年","1954年","1950年"],"answerIndex":2},{"c":"平和主義","q":"沖縄がアメリカから日本に返還された年は？","a":"1972年","e":"沖縄返還は1972年。","options":["1964年","1992年","1972年","1954年"],"answerIndex":2},{"c":"平和主義","q":"国連平和維持活動などへの協力に関係し、1992年に成立した法律は？","a":"PKO協力法","e":"1992年にPKO協力法が成立した。","options":["障害者差別解消法","PKO協力法","女性活躍推進法","男女雇用機会均等法"],"answerIndex":1},{"c":"憲法","q":"1789年のフランス革命期に発表された権利に関する宣言は？","a":"人権宣言（人間と市民の権利の宣言）","e":"1789年のフランス革命期に発表された。","options":["日本国憲法","ワイマール憲法","人権宣言（人間と市民の権利の宣言）","世界人権宣言"],"answerIndex":2},{"c":"憲法","q":"1919年にドイツで制定され、社会権を盛り込んだ憲法は？","a":"ワイマール憲法","e":"ワイマール憲法は1919年。社会権との関係で重要。","options":["日本国憲法","大日本帝国憲法","ワイマール憲法","アメリカ合衆国憲法"],"answerIndex":2},{"c":"人権","q":"自分の生き方や生活に関わる重要なことを自分で決める権利は？","a":"自己決定権","e":"自己決定権は自分の生き方などを自分で決める権利。","options":["請願権","国民審査","自己決定権","団結権"],"answerIndex":2},{"c":"現代社会","q":"時間・費用・労力などを無駄なく使えているか、という視点は？","a":"効率","e":"効率は無駄なく進められているか。公正は公平かという視点。","options":["公正","合意","対立","効率"],"answerIndex":3},{"c":"現代社会","q":"決め方や結果が一部の人に偏らず、公平かという視点は？","a":"公正","e":"公正は特定の人だけが有利・不利にならないかという視点。","options":["対立","情報化","効率","公正"],"answerIndex":3}];
const $ = id => document.getElementById(id);
let run = [], index = 0, correct = 0, picked = false, history = [];
const letters = ['A','B','C','D'];
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startQuiz(){const cat=$('category').value;let pool=QUESTIONS.filter(q=>cat==='all'||q.c===cat);pool=shuffle([...pool]);const n=$('count').value;run=pool.slice(0,n==='all'?pool.length:Number(n));index=0;correct=0;history=[];$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();}
function render(){picked=false;const q=run[index];$('counter').textContent=`第${index+1}問 / ${run.length}問`;$('scoreLive').textContent=`正解 ${correct}`;$('bar').style.width=`${index/run.length*100}%`;$('catLabel').textContent=q.c;$('question').textContent=q.q;$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===run.length-1?'結果を見る →':'次の問題 →';const root=$('answers');root.replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${letters[i]}</span><span></span>`;b.lastElementChild.textContent=opt;b.addEventListener('click',()=>choose(i));root.appendChild(b);});}
function choose(i){if(picked)return;picked=true;const q=run[index],ok=i===q.answerIndex;if(ok)correct++;history.push({q,choice:i,ok});[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q.answerIndex)b.classList.add('correct');else if(j===i)b.classList.add('incorrect');});const f=$('feedback');f.className='feedback show '+(ok?'good':'bad');const strong=document.createElement('strong');strong.textContent=ok?'正解！ 🎉':'おしい！ 正解は「'+q.options[q.answerIndex]+'」';const detail=document.createElement('div');detail.textContent=q.e;f.append(strong,detail);$('scoreLive').textContent=`正解 ${correct}`;$('bar').style.width=`${(index+1)/run.length*100}%`;$('next').disabled=false;}
function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('scoreFinal').textContent=`${correct} / ${run.length}`;const pct=Math.round(correct/run.length*100);$('resultTitle').textContent=pct===100?'満点！すごい！':pct>=80?'いい感じ！':'ここから復習しよう！';$('resultMessage').textContent=`正答率 ${pct}%。間違えた問題の解説を確認して、もう一度チャレンジ！`;$('bar').style.width='100%';const review=$('review');review.replaceChildren();history.forEach((h,i)=>{const d=document.createElement('div');d.className='review-item';const status=document.createElement('div');status.className=h.ok?'hit':'miss';status.textContent=h.ok?'✓ 正解':'✕ 要復習';const question=document.createElement('strong');question.textContent=`${i+1}. ${h.q.q}`;const ans=document.createElement('div');ans.textContent='正解：'+h.q.options[h.q.answerIndex];ans.style.marginTop='5px';const exp=document.createElement('div');exp.textContent=h.q.e;exp.style.color='var(--muted)';exp.style.fontSize='13px';exp.style.marginTop='4px';d.append(status,question,ans,exp);review.appendChild(d);});}
$('start').addEventListener('click',startQuiz);$('retry').addEventListener('click',()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden');});$('next').addEventListener('click',()=>{if(!picked)return;if(index<run.length-1){index++;render();}else finish();});$('quit').addEventListener('click',()=>{if(confirm('ここまでのクイズを終了する？'))finish();});
</script></body></html>
